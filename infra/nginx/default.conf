upstream creationbox_api {
    server api:8000;
}

upstream creationbox_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://creationbox_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /health {
        proxy_pass http://creationbox_api;
    }

    location / {
        proxy_pass http://creationbox_frontend;
        proxy_set_header Host $host;
    }
}
