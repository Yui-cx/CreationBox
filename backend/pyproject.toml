[project]
name = "creationbox-api"
version = "0.1.0"
description = "CreationBox MVP FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "pydantic-settings>=2.3.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx[socks]>=0.27.0",
    "redis>=5.0.4",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.9.0.80,<4.12.0.0",
    "Pillow>=9.5.0,<10.0.0",
    "python-multipart>=0.0.9",
    "simple-lama-inpainting>=0.1.2",
    "torch>=2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
